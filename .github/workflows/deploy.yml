name: Deploy Vite Site to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # [保留] 取得 Repository 原始碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # [保留] 建立 Node.js 環境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # [保留] 安裝相依套件
      - name: Install dependencies
        run: npm install

      # [保留] 執行 Vite Build
      - name: Build
        run: npm run build

      # [修改]
      # 第一次部署時若 GitHub Pages 尚未建立，
      # 自動啟用並初始化 Pages Site。
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # [保留] 上傳 Vite 產生的 dist 靜態網站
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      # [保留] 部署至 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
